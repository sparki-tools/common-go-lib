# Security scan for Common Go Library (dispatch-only)
#
# CI for this repo runs outside Actions: sparki-tools/.github scripts/lab-ci.sh
# runs vet, golangci-lint v2, build and `go test -race` on an exact sha and posts
# the commit status `mac-lab/ci`.
#
# What is left needs GitHub itself: gosec SARIF upload to code scanning. It runs
# on GitHub-hosted ubuntu-latest, only when dispatched by hand:
#   gh workflow run ci.yml -R sparki-tools/common-go-lib

name: Security

on:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    timeout-minutes: 30
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: Run Gosec Security Scanner
        uses: securego/gosec@v2.21.4
        with:
          args: -fmt=sarif -out=gosec.sarif ./...

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec.sarif
