# golangci-lint v2 configuration (pinned: v2.12.2, matching the Mac-lab CI and
# pre-commit). Migrated from v1 with `golangci-lint migrate`.
#
# Legacy debt (300+ findings on the full tree): the Mac-lab CI (.github repo,
# scripts/lab-ci.sh) lints only a PR's changes as a blocking gate and runs the
# full tree as advisory. Burn down debt, then make the full run blocking.
version: "2"
run:
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errname
    - errorlint
    - exhaustive
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goprintffuncname
    - gosec
    - lll
    - misspell
    - mnd
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - testpackage
    - tparallel
    - unconvert
    - unparam
    - whitespace
    - wsl
  disable:
    - depguard
    - wrapcheck
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    funlen:
      lines: 100
      statements: 50
    gocritic:
      disabled-checks:
        - hugeParam
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104
      config:
        G301: "0750"
        G302: "0640"
        G306: "0640"
    govet:
      enable:
        - shadow
    lll:
      line-length: 140
      tab-width: 4
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30
    nestif:
      min-complexity: 4
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: var-declaration
        - name: var-naming
    staticcheck:
      checks:
        - all
        - -ST1000
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - funlen
          - goconst
          - gosec
        path: _test\.go
      - linters:
          - lll
        source: '^//go:generate '
      - linters:
          - revive
        path: main\.go
        text: package-comments
    paths:
      - .*_gen\.go$
      - .*\.pb\.go$
      - vendor
      - third_party
      - testdata
      - examples
      - generated
      - mocks
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  new: false
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - .*_gen\.go$
      - .*\.pb\.go$
      - vendor
      - third_party
      - testdata
      - examples
      - generated
      - mocks
      - third_party$
      - builtin$
      - examples$
