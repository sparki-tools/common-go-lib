# golangci-lint configuration for sparki-tools Go projects
# Reference: https://golangci-lint.run/usage/configuration/
#
# Run: golangci-lint run
# Run with auto-fix: golangci-lint run --fix

run:
  timeout: 5m
  tests: true

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters:
  enable:
    # Default linters
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional recommended linters
    - bodyclose        # Checks whether HTTP response body is closed
    - dogsled          # Checks assignments with too many blank identifiers
    - dupl             # Code clone detection
    - errname          # Checks error names conform to Go conventions
    - errorlint        # Find code that will cause problems with error wrapping
    - exhaustive       # Check exhaustiveness of enum switch statements
    - copyloopvar      # Detects places where loop variables are copied
    - funlen           # Detects long functions
    - gochecknoinits   # Checks that no init functions are present
    - goconst          # Finds repeated strings that could be constants
    - gocritic         # Provides diagnostics to check for bugs/performance
    - gocyclo          # Computes cyclomatic complexity
    - godot            # Check if comments end with a period
    - gofmt            # Checks whether code was gofmt-ed
    - goimports        # Check import statements are formatted
    - mnd              # Magic number detector
    - goprintffuncname # Checks that printf-like functions are named with f
    - gosec            # Security checker
    - lll              # Reports long lines
    - misspell         # Finds commonly misspelled English words
    - nakedret         # Finds naked returns in long functions
    - nestif           # Reports deeply nested if statements
    - nilerr           # Finds code that returns nil even if it checks an error
    - nilnil           # Checks that there is no simultaneous return of nil error
    - noctx            # Finds HTTP requests without context.Context
    - nolintlint       # Reports ill-formed or insufficient nolint directives
    - prealloc         # Finds slice declarations that could be preallocated
    - predeclared      # Find code that shadows predeclared identifiers
    - revive           # Fast, configurable, extensible linter for Go
    - stylecheck       # Stylecheck is a replacement for golint
    - tenv             # Detects using os.Setenv instead of t.Setenv
    - testpackage      # Linter that makes you use a separate _test package
    - tparallel        # Detects inappropriate use of t.Parallel()
    - unconvert        # Remove unnecessary type conversions
    - unparam          # Reports unused function parameters
    - whitespace       # Detects leading and trailing whitespace
    - wsl              # Whitespace linter

  disable:
    - depguard         # Needs explicit config, disabled by default
    - wrapcheck        # Too strict for most use cases

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  funlen:
    lines: 100
    statements: 50

  gocyclo:
    min-complexity: 15

  govet:
    enable:
      - shadow

  lll:
    line-length: 140
    tab-width: 4

  misspell:
    locale: US

  nakedret:
    max-func-lines: 30

  nestif:
    min-complexity: 4

  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: increment-decrement
      - name: indent-error-flow
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: var-declaration
      - name: var-naming

  stylecheck:
    checks:
      - all
      - -ST1000  # Package comments (handled by revive)

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam  # Often too strict

  gosec:
    excludes:
      - G104  # Audit errors not checked (too noisy)
    config:
      G301: "0750"  # Dir permissions
      G302: "0640"  # File permissions
      G306: "0640"  # WriteFile permissions

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  new: false
  # Skip vendor, third_party, testdata, examples, generated
  exclude-dirs:
    - vendor
    - third_party
    - testdata
    - examples
    - generated
    - mocks
  exclude-files:
    - ".*_gen\\.go$"
    - ".*\\.pb\\.go$"
  exclude-rules:
    # Exclude some linters from running on tests
    - path: _test\.go
      linters:
        - funlen
        - dupl
        - gosec
        - goconst

    # Exclude lll issues for long lines in go:generate
    - linters:
        - lll
      source: "^//go:generate "

    # Exclude certain revive rules for main packages
    - path: main\.go
      linters:
        - revive
      text: "package-comments"
